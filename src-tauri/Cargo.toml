[package]
name = "llm-wiki"
version = "0.6.13"
description = "LLM Wiki - headless personal knowledge base backend"
authors = []
edition = "2021"
# AnyDoc and its archive/spreadsheet dependencies require Rust 1.88. Declaring
# the floor here gives contributors an immediate toolchain error instead of a
# late, platform-dependent dependency compilation failure.
rust-version = "1.88"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "llm_wiki_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Headless server: the only binary. Same core library as the former desktop
# app, no GUI shell.
[[bin]]
name = "llm-server"
path = "src/bin/llm-server.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock"] }
pdfium-render = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tiny_http = "0.12"
zip = "2"
calamine = "0.34.0"
docx-rs = "0.4.20"
office_oxide = "=0.1.2"
anydoc = "0.1.6"
lancedb = "0.27.2"
# tokio backs the server runtime (headless `llm-server`) and async commands.
arrow-array = "57"
arrow-schema = "57"
futures = "0.3"
# Claude/Codex CLI subprocess transports were removed with the desktop shell;
# tokio::process remains for the agent runtime's process needs.
tokio = { version = "1", features = ["process", "io-util", "sync", "macros", "rt", "rt-multi-thread", "signal", "time"] }
uuid = { version = "1", features = ["v4"] }
# Multimodal image extraction (Phase 1):
#   `image` re-encodes pdfium's raw bitmap output to PNG so API payloads are
#   self-contained.
#   `base64` serializes binary image data for JSON transport (~1.33× larger
#   than raw bytes but acceptable for our ~MB-scale per-image payloads).
#   `sha2` is for the dedup cache (Phase 3) — same image hash = same caption,
#   no redundant VLM calls.
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
sha2 = "0.10"
md-5 = "0.10"
walkdir = "2"
epub = "2.1.5"
mobi = "0.8"
html2text = { version = "0.17.1", default-features = false, features = ["xml"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
# Unwind (not abort) so third-party parser panics can be caught at the API
# boundary via panic_guard and turned into errors. Slightly larger binary,
# but prevents single-file corruption from killing the server.
panic = "unwind"
strip = true
