name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            rust_target: aarch64-apple-darwin
            pdfium: libpdfium.dylib
          - platform: ubuntu-22.04
            rust_target: ''
            pdfium: libpdfium.so
          - platform: ubuntu-22.04-arm
            rust_target: ''
            pdfium: libpdfium-arm64.so
          - platform: windows-latest
            rust_target: ''
            pdfium: pdfium.dll

    runs-on: ${{ matrix.platform }}
    env:
      CARGO_HTTP_MULTIPLEXING: "false"
      CARGO_NET_RETRY: "5"
      CARGO_HTTP_TIMEOUT: "60"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install protoc (macOS)
        if: startsWith(matrix.platform, 'macos-')
        run: brew install protobuf

      - name: Install protoc (Ubuntu)
        if: startsWith(matrix.platform, 'ubuntu-')
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Verify PDFium binary checksums
        if: matrix.platform != 'windows-latest'
        run: shasum -a 256 -c src-tauri/pdfium/SHA256SUMS

      - name: Use ARM64 pdfium binary (Ubuntu ARM only)
        if: matrix.platform == 'ubuntu-22.04-arm'
        run: |
          cp src-tauri/pdfium/libpdfium-arm64.so src-tauri/pdfium/libpdfium.so
          file src-tauri/pdfium/libpdfium.so

      - name: Install protoc (Windows)
        if: matrix.platform == 'windows-latest'
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build llm-server (release)
        working-directory: src-tauri
        run: cargo build --release --bin llm-server

      - name: Package server artifact
        shell: bash
        run: |
          VERSION=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d '"' -f 2)
          NAME="llm-wiki-server-${VERSION}-${{ matrix.platform }}"
          mkdir -p "dist-server/$NAME/pdfium"
          EXE="target/release/llm-server"
          [ -f "$EXE.exe" ] && EXE="$EXE.exe"
          cp "src-tauri/$EXE" "dist-server/$NAME/"
          cp "src-tauri/pdfium/${{ matrix.pdfium }}" "dist-server/$NAME/pdfium/"
          echo "$NAME" > dist-server/artifact-name.txt
          (cd dist-server && tar -czf "$NAME.tar.gz" "$NAME")
          ls -la dist-server

      - name: Upload artifact (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.platform }}
          path: dist-server/*.tar.gz
          retention-days: 14

      - name: Upload to draft release (tag runs)
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" --draft --title "LLM Wiki ${{ github.ref_name }}" --notes "Headless server release." 2>/dev/null || true
          gh release upload "${{ github.ref_name }}" dist-server/*.tar.gz --clobber
