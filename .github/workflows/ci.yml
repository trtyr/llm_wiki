name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install protoc (macOS)
        if: matrix.platform == 'macos-latest'
        run: brew install protobuf

      - name: Install protoc (Linux/Windows)
        if: matrix.platform != 'macos-latest'
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y protobuf-compiler
          else
            choco install protoc -y
          fi
        shell: bash

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check Rust build
        working-directory: src-tauri
        run: cargo build

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --lib -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --lib

  e2e:
    name: End-to-end API tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Build llm-server
        working-directory: src-tauri
        run: cargo build --bin llm-server

      - name: Start headless server
        working-directory: src-tauri
        env:
          LLM_WIKI_DATA_DIR: ${{ runner.temp }}/e2e-data
          LLM_WIKI_BIND_PORT: "19828"
          LLM_WIKI_API_TOKEN: ci-e2e-token
        run: |
          ./target/debug/llm-server &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:19828/health && break
            sleep 1
          done

      - name: Run E2E suite
        env:
          LLM_WIKI_API_TOKEN: ci-e2e-token
        run: |
          python scripts/e2e_test.py --base http://127.0.0.1:19828 --token ci-e2e-token --skip-llm
